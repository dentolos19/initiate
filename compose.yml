services:
  database:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: initiate-postgres
    environment:
      POSTGRES_DB: initiate
      POSTGRES_PASSWORD: initiate
      POSTGRES_USER: initiate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U initiate -d initiate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./.postgres:/var/lib/postgresql/data
