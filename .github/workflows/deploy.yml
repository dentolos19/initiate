name: Web Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy
    environment: Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Project
        run: bun run build

      - name: Migrate Database
        run: just migrate --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            ELEVENLABS_AGENT_ID
            ELEVENLABS_API_KEY
            EMAIL_FROM_ADDRESS
            EMAIL_FROM_NAME
            OPENROUTER_API_KEY
            OPENROUTER_EMBEDDING_DIMENSIONS
            OPENROUTER_EMBEDDING_MODEL
            OPENROUTER_MODEL
            OPENROUTER_REFERER
            OPENROUTER_TITLE
            REALTIMEKIT_APP_ID
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          ELEVENLABS_AGENT_ID: ${{ vars.ELEVENLABS_AGENT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_EMBEDDING_DIMENSIONS: ${{ vars.OPENROUTER_EMBEDDING_DIMENSIONS }}
          OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_REFERER: ${{ vars.OPENROUTER_REFERER }}
          OPENROUTER_TITLE: ${{ vars.OPENROUTER_TITLE }}
          REALTIMEKIT_APP_ID: ${{ vars.REALTIMEKIT_APP_ID }}
